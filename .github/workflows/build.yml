name: Build OrangeFox for Moto G85 (malmo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
    - name: Free Disk Space and Configure Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo docker image prune -a -f
        sudo swapoff -a || true
        sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3 python-is-python3 lz4
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: malmo_dt

    - name: Sync OrangeFox Sources
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git clone https://gitlab.com/OrangeFox/sync.git ~/sync
        cd ~/sync
        ./orangefox_sync.sh --branch 14.1 --path ~/fox

    - name: Setup Device Tree
      run: |
        mkdir -p ~/fox/device/motorola
        mv $GITHUB_WORKSPACE/malmo_dt ~/fox/device/motorola/malmo

    - name: Build OrangeFox Recovery
      run: |
        cd ~/fox
        export GOMEMLIMIT=6144MiB
        export _JAVA_OPTIONS="-Xmx4g"
        set +e
        source build/envsetup.sh
        set -e
        lunch fox_malmo-ap2a-eng || lunch twrp_malmo-ap2a-eng
        mka recoveryimage -j$(nproc --all)
        # Ensure ramdisk is compressed with LZ4 legacy and fits under Motorola ABL limit (< 20MB)
        cd ~/fox/out/target/product/malmo
        PRODUCT_DIR="$PWD"
        mkdir -p /tmp/repack_rd && cd /tmp/repack_rd
        if [ -f "$PRODUCT_DIR/ramdisk-recovery.img" ]; then
          if file "$PRODUCT_DIR/ramdisk-recovery.img" | grep -q "gzip"; then
            gzip -dc "$PRODUCT_DIR/ramdisk-recovery.img" | cpio -idm 2>/dev/null
          else
            lz4 -dc "$PRODUCT_DIR/ramdisk-recovery.img" | cpio -idm 2>/dev/null
          fi
          rm -rf system/etc/terminfo
          find twres/languages -type f ! -name "en.xml" ! -name "ru.xml" -delete 2>/dev/null || true
          find . | cpio -o -H newc 2>/dev/null | lz4 -l -12 --favor-decSpeed > "$PRODUCT_DIR/ramdisk-recovery-lz4.img"
          cd "$PRODUCT_DIR"
          python3 ~/fox/system/tools/mkbootimg/mkbootimg.py \
            --header_version 4 \
            --ramdisk ramdisk-recovery-lz4.img \
            --os_version 14.0.0 \
            --os_patch_level 2099-12 \
            -o recovery.img
          cp recovery.img OrangeFox-R12.0-Beta-malmo.img 2>/dev/null || true
          cp ramdisk-recovery-lz4.img ramdisk-recovery.img
        fi
        rm -rf /tmp/repack_rd
        cd ~/fox
        # Create boot image for fastboot boot (kernel + recovery ramdisk)
        python3 system/tools/mkbootimg/mkbootimg.py \
          --header_version 4 \
          --kernel device/motorola/malmo/prebuilt/kernel \
          --ramdisk out/target/product/malmo/ramdisk-recovery.img \
          --os_version 14.0.0 \
          --os_patch_level 2099-12 \
          -o out/target/product/malmo/boot-fastboot.img || true

    - name: Upload Recovery Images
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-MotoG85-Images
        path: |
          ~/fox/out/target/product/malmo/recovery.img
          ~/fox/out/target/product/malmo/boot-fastboot.img
          ~/fox/out/target/product/malmo/OrangeFox*.zip
          ~/fox/out/target/product/malmo/OrangeFox*.img
