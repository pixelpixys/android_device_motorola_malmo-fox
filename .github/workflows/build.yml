name: Build OrangeFox for Moto G85 (malmo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo docker image prune -a -f

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: malmo_dt

    - name: Init OrangeFox Manifest
      run: |
        mkdir -p ~/fox && cd ~/fox
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Setup Device Tree
      run: |
        mkdir -p ~/fox/device/motorola
        mv $GITHUB_WORKSPACE/malmo_dt ~/fox/device/motorola/malmo

    - name: Build OrangeFox Recovery
      run: |
        cd ~/fox
        source build/envsetup.sh
        lunch fox_malmo-eng || lunch fox_malmo-userdebug
        mka bootimage recoveryimage -j$(nproc --all)

    - name: Upload Recovery Images
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-MotoG85-Images
        path: |
          ~/fox/out/target/product/malmo/recovery.img
          ~/fox/out/target/product/malmo/boot.img
          ~/fox/out/target/product/malmo/OrangeFox*.zip
